services:
  nginx:
    image: nginx:1.29-alpine
    develop:
      watch:
        - action: restart
          path: config/nginx/nginx.conf
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - source: config/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        type: bind
      - source: wagtail-static
        target: /usr/share/nginx/html/static
        type: volume
      - source: wagtail-media
        target: /usr/share/nginx/html/media
        type: volume
      - source: frontend
        target: /usr/share/nginx/html
        type: bind
      - source: config/frontend/config.json
        target: /usr/share/nginx/html/config.json
        type: bind
    depends_on:
      wagtail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  wagtail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DJANGO_SETTINGS_MODULE: "cheminova.settings.dev"
    develop:
      watch:
        - action: sync
          path: src
          target: /app
          initial_sync: true
    command: ["uv", "run", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
      POSTGRES_HOST:
      SECRET_KEY:
      BASE_PATH: /cms/
      S3_CONFIG_PATH: /home/wagtail/.aws/config
      BUCKET_ALIAS: local-cheminova
      BUCKET_NAME: local-cheminova
      DB_DUMP_PATH: db-dump
      PRODUCTION_FRONTEND_URL:
    volumes:
      - source: config/aws/config
        target: /home/wagtail/.aws/config
        type: bind
      - source: wagtail-static
        target: /app/static
        type: volume
      - source: wagtail-media
        target: /app/media
        type: volume
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      start_interval: 2s
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 5

  database:
    image: postgres:18
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - source: wagtail-db-data
        target: /var/lib/postgresql
        type: volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      start_interval: 5s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  media-backup:
    image: amazon/aws-cli:2.36.45
    entrypoint: ["/bin/bash", "/usr/local/bin/media-backup.sh"]
    environment:
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_PROFILE: local-cheminova
      BUCKET_NAME: local-cheminova
      MEDIA_PREFIX: media
      BACKUP_INTERVAL: 30
    volumes:
      - source: config/aws/config
        target: /root/.aws/config
        type: bind
        read_only: true
      - source: config/aws/media-backup.sh
        target: /usr/local/bin/media-backup.sh
        type: bind
        read_only: true
      - source: wagtail-media
        target: /media
        type: volume
    depends_on:
      s3:
        condition: service_healthy
      wagtail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "aws", "s3api", "head-bucket", "--bucket", "local-cheminova"]
      start_interval: 5s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  s3:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: local-cheminova
    volumes:
      - source: config/garage/garage.toml
        target: /etc/garage.toml
        type: bind
        read_only: true
      - source: garage-meta
        target: /var/lib/garage/meta
        type: volume
      - source: garage-data
        target: /var/lib/garage/data
        type: volume
    ports:
      - published: 3900
        target: 3900
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "local-cheminova"]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  wagtail-db-data:
  wagtail-static:
  wagtail-media:
  garage-meta:
  garage-data:
