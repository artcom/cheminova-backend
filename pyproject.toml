[project]
name = "cheminova-backend"
version = "2.10.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.21",
    "caseutil>=0.7.2",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "wagtail==7.4.0",
    "wagtail-localize==1.13.1",
]

[dependency-groups]
dev = [
 "django-cors-headers>=4.9.0",
 "invoke>=3.0.3",
 "ruff>=0.15.15",
]

[tool.ruff]
exclude = [".venv", ".git", ".vscode", "__pycache__"]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
